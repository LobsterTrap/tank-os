name: Validate Build and Create Release

on:
  push:
    branches:
      - main

permissions: read-all

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Podman
      run: |
        sudo apt-get update
        sudo apt-get install -y podman

    - name: Build image
      run: make build ARCH=${{ matrix.arch }}

    - name: Validate image
      run: podman image inspect localhost/tank-os:latest

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: Check release token
      id: check_release_token
      env:
        FG_PAT: ${{ secrets.FG_PAT }}
      run: |
        if [ -n "$FG_PAT" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "FG_PAT is not set; skipping semantic release."
        fi

    - name: Checkout repository
      if: ${{ steps.check_release_token.outputs.available == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.FG_PAT }}

    - name: Python Semantic Release
      if: ${{ steps.check_release_token.outputs.available == 'true' }}
      id: release
      uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
      with:
        github_token: ${{ secrets.FG_PAT }}
